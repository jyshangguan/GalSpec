# Fit IRAS 07546+3928 the way example/fit_iras07546_jax.py does, from a file.
#
#   ./fit_iras07546_config.sh --dry-run      # what would be fitted
#   ./fit_iras07546_config.sh                # the fit (~12 min on a GPU)
#   python -m galspec.pipeline fit_iras07546_config.toml
#
# The data are data/iras07546_pipeline.fits, written once by
# develop/dev_config/convert_iras07546.py: the observed-frame spectrum plus the
# error estimate of iras07546_model.load_spectrum().  Everything the model
# needs to know about the object that is not a number in this file is in that
# header -- REDSHIFT and EBV -- and this file says how to use it.
#
# The model is the "template" model of the example: seventeen additive components,
# 27 free parameters, one measured narrow-line profile, broad lines and the iron
# pseudo-continuum tied to broad H-alpha.  The published evidence for this model and
# data is log Z = 130677.27 +/- 0.58 (example/iras07546_model.py, REFERENCE["template"],
# 400 live points, dlogz 0.01) under set_priors().
#
# One prior deliberately differs.  set_priors() puts an *absolute* 1e-3 under every
# line amplitude; this file lets the default scale it with the spectrum
# (1e-3*continuum_level, 5e-4 here), so each of the sixteen log-uniform amplitudes is
# wider in log-range by ln(12.99/5e-4)/ln(12.99/1e-3) = 1.074 and contributes
# -ln(1.074) = -0.071 to log Z: a run of this file should report about 130676.1, and
# nothing else -- the posteriors are the same, because a constant factor times a
# log-uniform prior changes the normalisation, not the shape.  Override the
# ``# default:`` blocks below with absolute limits to reproduce 130677.27 exactly.
#
# How the file was developed and tested: develop/dev_config/ (test_iras07546_config.py
# checks the parity with the script below, and make_report.py writes the walkthrough).
#
# Read this file next to the script: every [model.component] below is one call of
# build_continuum() / build_iron_template() / build_narrow_lines() /
# build_broad_lines(), the tie tables are tie_narrow_lines() + tie_broad_lines() +
# tie_iron_template(), and the prior tables are set_priors(), with the pipeline's
# default filling in wherever the script's number is the default's.  No starting
# value is written at all: nested sampling draws from the prior.  Nothing else is
# going on, which is the point of having the mode.

[run]
output_dir = "out/iras07546"
workers = 1

# ---- the data ----------------------------------------------------------------------
[data]
file = "data/iras07546_pipeline.fits"
# The measured narrow-line profile travels inside this file: HDU NARROW is a
# two-column table (velocity in km/s, normalised flux), and every component whose
# model takes a line profile uses it unless it names its own template_file.
narrow_template_key = "NARROW"

# The header carries both corrections, and each is one keyword: the pipeline's own
# defaults are ZRED and EBV, and this file names REDSHIFT instead because that is what
# the converter wrote.  An A_V in place of a colour excess is divided by R_V = 3.1
# (``extinction_rv``), which only a configuration can set -- no header is trusted for it.
z_key = "REDSHIFT"
e_bv_key = "EBV"
extinction = true           # de-redden with ccm89 before shifting to the rest frame
# extinction_rv = 3.1       # R_V of the reddening law; the default

# the rest-frame window of the example, and the percentile that set_priors() calls
# ``np.percentile(flux, 15.0)``
wave_min = 4200.0
wave_max = 6800.0
continuum_percentile = 15.0
min_pixels = 50000

# ---- how hard to work on it ---------------------------------------------------------
[fit]
nlive = 400
dlogz = 0.01
max_iterations = 200000
share_compilation = true
device = "auto"

[output]
fit_plot = true
corner = true
corner_params = [
    "Continuum.amplitude", "Continuum.alpha", "FeII.amplitude",
    "b_halpha.amp_c", "b_halpha.amp_w0", "b_halpha.dv_c", "b_halpha.sigma_c",
    "b_halpha.dv_w0", "b_halpha.sigma_w0",
    "n_halpha.amplitude", "OIII.dv_c", "b_hei.amp_c", "b_heii.amp_c",
]
histogram = true
hist_params = [
    "Continuum.alpha", "FeII.amplitude", "b_halpha.amp_c", "b_halpha.amp_w0",
    "b_halpha.dv_c", "b_halpha.sigma_c", "b_halpha.dv_w0", "b_halpha.sigma_w0",
    "n_halpha.amplitude", "OIII.dv_c", "SII.amp_c0", "SII.amp_c1",
]

# ------------------------------------------------------------------------------------
# The model.  Components are summed in this order; the names are what the ties and
# the corner plot refer to.
# ------------------------------------------------------------------------------------
[model]
# No starting values: a parameter's value is only where a search would begin, and a
# nested sampler never begins -- it draws its live points from the prior.  What is
# left below is what the model *is*: the line centres (``wavec``), the continuum's
# pivot (``x_0``), the fixed iron redshift, the number of Gaussians in a profile, and
# the ties that make one line's kinematics another's.  The values
# ``fit_iras07546_jax.py`` starts from are in the comment above each component, and
# ``--dry-run`` prints the ones the pipeline resolved.
#
# Every free parameter has a prior, and twenty-one of the twenty-seven take the
# pipeline's default for their kind: the blocks below are comments, and deleting the
# leading '#' overrides one.  Six are written out, each because it is a statement about
# this object: the broad lines' widths, 300-8000 km/s (the default floor is 10, which is
# a *narrow* line's), the continuum's ``0.2-4*continuum_level``, the iron ceiling
# against the continuum rather than against the brightest pixel, and the two
# narrow-line velocity windows, broad H-alpha's and [O III]'s.
#
# ``require_priors = true`` would demand that *every* prior be written here; it is not
# set because the commented blocks are meant to stay defaults.  Set it in a
# configuration whose priors you want checked.

# ---- 1. the power-law continuum ----------------------------------------------------
# PowerLaw1D(amplitude=0.55, x_0=5500, alpha=1, fixed={"x_0": True}, name="Continuum")
[[model.component]]
type = "PowerLaw1D"
name = "Continuum"
x_0 = 5500.0
fixed = { x_0 = true }

[model.component.priors.amplitude]
kind = "loguniform"
lower = "0.2*continuum_level"
upper = "4*continuum_level"

# default prior of Continuum.alpha: uniform(-5, 5) -- uncomment to override
# [model.component.priors.alpha]
# kind = "uniform"
# lower = -5.0
# upper = 5.0

# ---- 2. the iron pseudo-continuum --------------------------------------------------
# IronTemplate_tied(n_components=2, amplitude=0.2, z=0, dv_c=0, sigma_c=1500,
#                   amp_w0=0.10, dv_w0=0, sigma_w0=6000, name="FeII") with iron.z fixed
# and every kernel parameter tied to broad H-alpha below: the iron costs one number.

[[model.component]]
type = "IronTemplate_tied"
name = "FeII"
n_components = 2
z = 0.0
fixed = { z = true }

[model.component.ties]
dv_c = "b_halpha.dv_c"
sigma_c = "b_halpha.sigma_c"
amp_w0 = "b_halpha.amp_w0"
dv_w0 = "b_halpha.dv_w0"
sigma_w0 = "b_halpha.sigma_w0"

# explicit: the ceiling is the continuum level, not the brightest pixel (the iron
# blend is not what sets the flux scale).  The floor is the default's.
[model.component.priors.amplitude]
kind = "loguniform"
lower = "1e-3*continuum_level"
upper = "3*continuum_level"

# ---- 3. hydrogen: the three Balmer lines -------------------------------------------
# Each line is a narrow one on the measured profile plus a broad core and wind.  The
# script's starting points, which the sampler does not need, are
#   n_halpha 2.2 / b_halpha 0.65 (amp_c) 0.10 (amp_w0) / n_hbeta 0.8 / b_hbeta 0.22
#   n_hgamma 0.4 / b_hgamma 0.10 (amp_c) 0.20 (amp_w0), every dv 0, sigma 1500 + 6000.
# Broad H-alpha owns the kinematics that every other broad line -- and the iron kernel
# above -- follows, component by component.

[[model.component]]
type = "Line_template"
name = "n_halpha"
wavec = "@Halpha"

[model.component.ties]
dv = "OIII.dv_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amplitude]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

[[model.component]]
type = "Line_MultiGauss"
name = "b_halpha"
n_components = 2
wavec = "@Halpha"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

# default prior of b_halpha.amp_w0: uniform(0, 1) -- uncomment to override
# [model.component.priors.amp_w0]
# kind = "uniform"
# lower = 0.0
# upper = 1.0

[model.component.priors.dv_c]
kind = "uniform"
lower = -2500.0
upper = 2500.0

# explicit: broad-line width 300-8000 km/s (the default starts at 10)
[model.component.priors.sigma_c]
kind = "uniform"
lower = 300.0
upper = 8000.0

# default prior of b_halpha.dv_w0: uniform(-6000, 6000) -- uncomment to override
# [model.component.priors.dv_w0]
# kind = "uniform"
# lower = -6000.0
# upper = 6000.0

# explicit: broad-line width 300-8000 km/s (the default starts at 10)
[model.component.priors.sigma_w0]
kind = "uniform"
lower = 300.0
upper = 8000.0

[[model.component]]
type = "Line_template"
name = "n_hbeta"
wavec = "@Hbeta"

[model.component.ties]
dv = "OIII.dv_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amplitude]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

[[model.component]]
type = "Line_MultiGauss"
name = "b_hbeta"
n_components = 2
wavec = "@Hbeta"

[model.component.ties]
dv_c = "b_halpha.dv_c"
sigma_c = "b_halpha.sigma_c"
dv_w0 = "b_halpha.dv_w0"
sigma_w0 = "b_halpha.sigma_w0"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

# default prior of b_hbeta.amp_w0: uniform(0, 1) -- uncomment to override
# [model.component.priors.amp_w0]
# kind = "uniform"
# lower = 0.0
# upper = 1.0

[[model.component]]
type = "Line_template"
name = "n_hgamma"
wavec = "@Hgamma"

[model.component.ties]
dv = "OIII.dv_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amplitude]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

[[model.component]]
type = "Line_MultiGauss"
name = "b_hgamma"
n_components = 2
wavec = "@Hgamma"

[model.component.ties]
dv_c = "b_halpha.dv_c"
sigma_c = "b_halpha.sigma_c"
dv_w0 = "b_halpha.dv_w0"
sigma_w0 = "b_halpha.sigma_w0"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

# default prior of b_hgamma.amp_w0: uniform(0, 1) -- uncomment to override
# [model.component.priors.amp_w0]
# kind = "uniform"
# lower = 0.0
# upper = 1.0

# ---- 4. the forbidden doublets -----------------------------------------------------
# Line_template_doublet(amp_c0=1.8, amp_c1=1.8/2.98, dv_c=0, wavec0=OIII_5007,
#                       wavec1=OIII_4959, name="OIII"); the 2.98 is atomic physics.
# [O III] also owns the narrow-line velocity every other narrow line follows.

[[model.component]]
type = "Line_template_doublet"
name = "OIII"
wavec0 = "@OIII_5007"
wavec1 = "@OIII_4959"

[model.component.ties]
amp_c1 = { kind = "doublet_ratio", ref = "OIII", ratio = 2.98 }

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c0]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

[model.component.priors.dv_c]
kind = "uniform"
lower = -1000.0
upper = 1000.0

[[model.component]]
type = "Line_template_doublet"
name = "NII"
wavec0 = "@NII_6583"
wavec1 = "@NII_6548"

[model.component.ties]
amp_c1 = { kind = "doublet_ratio", ref = "NII", ratio = 2.96 }
dv_c = "OIII.dv_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c0]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

# [S II]: both peaks keep their own amplitude, because 6716/6731 is a density
# diagnostic and not an atomic constant

[[model.component]]
type = "Line_template_doublet"
name = "SII"
wavec0 = "@SII_6716"
wavec1 = "@SII_6731"

[model.component.ties]
dv_c = "OIII.dv_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c0]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c1]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

[[model.component]]
type = "Line_template_doublet"
name = "OI"
wavec0 = "@OI_6300"
wavec1 = "@OI_6364"

[model.component.ties]
amp_c1 = { kind = "doublet_ratio", ref = "OI", ratio = 3.00 }
dv_c = "OIII.dv_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c0]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

# ---- 5. helium: He II 4686, narrow and broad ---------------------------------------
# Line_template(amplitude=0.08) on the narrow velocity, plus one broad Gaussian riding
# the shape of broad H-alpha's core with only its own peak free.

[[model.component]]
type = "Line_template"
name = "HeII"
wavec = "@HeII_4686"

[model.component.ties]
dv = "OIII.dv_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amplitude]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

[[model.component]]
type = "Line_MultiGauss"
name = "b_heii"
n_components = 1
wavec = "@HeII_4686"

[model.component.ties]
dv_c = "b_halpha.dv_c"
sigma_c = "b_halpha.sigma_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

# ---- 6. the faint ones --------------------------------------------------------------
# [O III] 4363 and He I 5876: weak enough that each narrow line stays a single Gaussian
# on the narrow-line velocity, and He I's broad wing a single Gaussian on the shape of
# broad H-alpha's core with only its own peak free.

[[model.component]]
type = "Line_template"
name = "OIII4363"
wavec = "@OIII_4363"

[model.component.ties]
dv = "OIII.dv_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amplitude]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

[[model.component]]
type = "Line_template"
name = "n_hei"
wavec = "@HeI_5876"

[model.component.ties]
dv = "OIII.dv_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amplitude]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

[[model.component]]
type = "Line_MultiGauss"
name = "b_hei"
n_components = 1
wavec = "@HeI_5876"

[model.component.ties]
dv_c = "b_halpha.dv_c"
sigma_c = "b_halpha.sigma_c"

# default: loguniform(1e-3*continuum_level, 3*max_flux) -- uncomment to override
# [model.component.priors.amp_c]
# kind = "loguniform"
# lower = "1e-3*continuum_level"
# upper = "3*max_flux"

